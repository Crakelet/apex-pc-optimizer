name: Error de la aplicación
description: Comunica un fallo con pasos y mensajes sin datos privados.
title: "[Error] "
body:
  - type: markdown
    attributes:
      value: |
        Para vulnerabilidades sigue SECURITY.md. Este informe será público: oculta nombres, rutas personales, identificadores de cuenta y direcciones de red. No adjuntes respaldos, AppData, volcados o registros completos. Para un aviso del antivirus basta inicialmente con su nombre, módulo, amenaza, versión de Apex y SHA-256 del ejecutable; no publiques una muestra aquí.
  - type: input
    id: version
    attributes:
      label: Versión de Apex
      placeholder: "Ejemplo: 1.0.2 · Portable o Setup"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows y modo de ejecución
      description: Indica versión o compilación, modo normal o simulado y si usabas permisos de administrador.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Identifica la herramienta o ajuste y si la aplicación o el juego correspondiente estaban abiertos.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
      description: Copia el mensaje después de ocultar datos personales. Explica también si quedó un respaldo pendiente.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Revisión del informe
      options:
        - label: Revisé que el texto y los adjuntos no contienen datos personales, credenciales ni respaldos.
          required: true
